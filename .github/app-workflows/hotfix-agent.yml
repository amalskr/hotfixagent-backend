name: HotFix Agent

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('HotFix: {0} in {1}', github.event.inputs.exceptionType, github.event.inputs.targetClass)
      || format('HotFix: {0} in {1}', github.event.client_payload.exceptionType, github.event.client_payload.targetClass) }}

# Triggered by the Cloud Function via repository_dispatch (type must match
# config.dispatchEventType in hotfix.config.ts). workflow_dispatch = manual test.
#
# CI-side app settings come from repo VARIABLES (Settings → Secrets and
# variables → Actions → Variables), with safe defaults:
#   HOTFIX_BRANCH        (default: main)        branch to fork the fix from
#   HOTFIX_PR_BASE       (default: main)        PR base (human can re-target to e.g. development)
#   HOTFIX_BUILD_CMD     (default: ./gradlew assembleDebug)
#   HOTFIX_TEST_CMD      (default: ./gradlew testDebugUnitTest)
#   HOTFIX_JAVA_VERSION  (default: 17)
on:
  repository_dispatch:
    types: [hotfix-crash]
  workflow_dispatch:
    inputs:
      exceptionType:   { description: "Exception type", required: true, default: "java.lang.ArithmeticException" }
      targetClass:     { description: "Blamed class",   required: true, default: "com.example.app.MainActivityKt" }
      targetMethod:    { description: "Blamed method",  required: true, default: "onCreate" }
      message:         { description: "Crash message",  required: false, default: "divide by zero" }
      issueId:         { description: "Crashlytics issue id", required: false, default: "manual-test" }
      llm:             { description: "LLM (claude or gemini)", required: false, default: "claude", type: choice, options: [claude, gemini] }

# Atomic per-issue guard: only one run per crash issue at a time (a second
# event for the same issue while one is running will not start a parallel run).
concurrency:
  group: hotfix-${{ github.event.client_payload.issueId || github.event.inputs.issueId }}
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    # Which LLM runs the agent. Manual runs pick it from the dropdown; everything
    # else follows the HOTFIX_LLM repo variable, defaulting to Claude.
    env:
      LLM: ${{ github.event.inputs.llm || vars.HOTFIX_LLM || 'claude' }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.HOTFIX_BRANCH || 'main' }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ vars.HOTFIX_JAVA_VERSION || '17' }}

      - name: Run HotFix agent (Claude)
        if: env.LLM != 'gemini'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A production crash was reported by Firebase Crashlytics in this Android app.
            The live app is published from the `${{ vars.HOTFIX_BRANCH || 'main' }}` branch, so this is a hotfix.

            Exception type : ${{ github.event.client_payload.exceptionType || github.event.inputs.exceptionType }}
            Message        : ${{ github.event.client_payload.message || github.event.inputs.message }}
            Blamed class   : ${{ github.event.client_payload.targetClass || github.event.inputs.targetClass }}
            Blamed method  : ${{ github.event.client_payload.targetMethod || github.event.inputs.targetMethod }}
            Crashlytics id : ${{ github.event.client_payload.issueId || github.event.inputs.issueId }}
            Confidence     : ${{ github.event.client_payload.confidence || 'auto' }}

            Do the following, carefully:
            1. Find the Kotlin/Java file containing that class and method. The method
               may be a synthesized lambda name (e.g. "foo\$lambda\$3") — in that case
               look at the base function. If the blamed class is "unknown" or lives
               only in the SDK/framework (e.g. com.google.*, android.*), search the
               app source for the nearest related call site instead.
            2. Diagnose the ROOT CAUSE and apply a MINIMAL, safe fix that addresses
               WHY the exception is thrown — validate input, add a null/bounds/state
               guard, or correct the logic. Do NOT refactor unrelated code.
            3. Build with `${{ vars.HOTFIX_BUILD_CMD || './gradlew assembleDebug' }}` and run
               `${{ vars.HOTFIX_TEST_CMD || './gradlew testDebugUnitTest' }}`. If they fail,
               read the errors and iterate until both pass.
            4. Do NOT edit `${{ vars.HOTFIX_BRANCH || 'main' }}` directly. Create a new branch
               named exactly `${{ github.event.client_payload.branchName || format('agent/manual-{0}', github.event.inputs.issueId) }}`
               off `${{ vars.HOTFIX_BRANCH || 'main' }}`, commit the fix there, and open a Pull
               Request with base branch `${{ vars.HOTFIX_PR_BASE || 'main' }}`. In the PR body
               explain the crash, root cause, fix, and Crashlytics issue id. DO NOT merge —
               a human decides whether to merge into `${{ vars.HOTFIX_PR_BASE || 'main' }}` or
               re-target it.

            IMPORTANT quality rules:
            - NEVER silence a crash with an empty or swallowing try/catch.
            - NEVER catch kotlinx.coroutines CancellationException / JobCancellationException.
            - This may be an environmental crash (network, DNS, SSL, out-of-memory, IPC).
              If there is no genuine app-code root cause, or you are not confident the
              change fixes it, open the PR as a DRAFT and explain what a human should check.
          claude_args: |
            --max-turns ${{ vars.HOTFIX_MAX_TURNS || '40' }}
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(./gradlew:*),Bash(git:*),Bash(gh:*)"

      # Same job, same prompt, Gemini instead of Claude. The Gemini CLI has no
      # built-in git/PR plumbing, so step 4 spells out the git + gh commands.
      # GEMINI_CLI_TRUST_WORKSPACE is required: a CI checkout is never a
      # "trusted folder", and without it the CLI ignores --yolo and exits 1.
      - name: Run HotFix agent (Gemini)
        if: env.LLM == 'gemini'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.HOTFIX_GEMINI_MODEL }}
          prompt: |
            A production crash was reported by Firebase Crashlytics in this Android app.
            The live app is published from the `${{ vars.HOTFIX_BRANCH || 'main' }}` branch, so this is a hotfix.

            Exception type : ${{ github.event.client_payload.exceptionType || github.event.inputs.exceptionType }}
            Message        : ${{ github.event.client_payload.message || github.event.inputs.message }}
            Blamed class   : ${{ github.event.client_payload.targetClass || github.event.inputs.targetClass }}
            Blamed method  : ${{ github.event.client_payload.targetMethod || github.event.inputs.targetMethod }}
            Crashlytics id : ${{ github.event.client_payload.issueId || github.event.inputs.issueId }}
            Confidence     : ${{ github.event.client_payload.confidence || 'auto' }}

            Do the following, carefully:
            1. Find the Kotlin/Java file containing that class and method. The method
               may be a synthesized lambda name (e.g. "foo\$lambda\$3") — in that case
               look at the base function. If the blamed class is "unknown" or lives
               only in the SDK/framework (e.g. com.google.*, android.*), search the
               app source for the nearest related call site instead.
            2. Diagnose the ROOT CAUSE and apply a MINIMAL, safe fix that addresses
               WHY the exception is thrown — validate input, add a null/bounds/state
               guard, or correct the logic. Do NOT refactor unrelated code.
            3. Build with `${{ vars.HOTFIX_BUILD_CMD || './gradlew assembleDebug' }}` and run
               `${{ vars.HOTFIX_TEST_CMD || './gradlew testDebugUnitTest' }}`. If they fail,
               read the errors and iterate until both pass.
            4. Do NOT edit `${{ vars.HOTFIX_BRANCH || 'main' }}` directly. You have shell
               access, and git and gh are already authenticated. Run:
                 git config user.name "hotfix-agent[bot]"
                 git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                 git checkout -b '${{ github.event.client_payload.branchName || format('agent/manual-{0}', github.event.inputs.issueId) }}'
               commit ONLY the files you changed, then:
                 git push -u origin '${{ github.event.client_payload.branchName || format('agent/manual-{0}', github.event.inputs.issueId) }}'
                 gh pr create --base '${{ vars.HOTFIX_PR_BASE || 'main' }}' --title <title> --body <body>
               In the PR body explain the crash, root cause, fix, and Crashlytics issue
               id. Add --draft if you are not confident. DO NOT merge — never run
               'gh pr merge'. Do not commit .gemini/, build outputs, or unrelated files.

            IMPORTANT quality rules:
            - NEVER silence a crash with an empty or swallowing try/catch.
            - NEVER catch kotlinx.coroutines CancellationException / JobCancellationException.
            - This may be an environmental crash (network, DNS, SSL, out-of-memory, IPC).
              If there is no genuine app-code root cause, or you are not confident the
              change fixes it, open the PR as a DRAFT and explain what a human should check.
          settings: |
            {
              "model": { "maxSessionTurns": ${{ vars.HOTFIX_MAX_TURNS || '40' }} },
              "tools": {
                "core": [
                  "read_file", "read_many_files", "write_file", "replace",
                  "glob", "search_file_content", "list_directory", "run_shell_command"
                ]
              }
            }

      - name: Report status to Slack
        if: always()
        env:
          CALLBACK_URL:  ${{ secrets.HOTFIX_CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_ID: ${{ github.event.client_payload.issueId || github.event.inputs.issueId }}
          EXC: ${{ github.event.client_payload.exceptionType || github.event.inputs.exceptionType }}
          CLS: ${{ github.event.client_payload.targetClass || github.event.inputs.targetClass }}
          MTH: ${{ github.event.client_payload.targetMethod || github.event.inputs.targetMethod }}
        run: |
          set -e
          BRANCH="${{ github.event.client_payload.branchName || format('agent/manual-{0}', github.event.inputs.issueId) }}"
          PR_JSON=$(gh pr list --head "$BRANCH" --state open --json url,isDraft --limit 1 2>/dev/null || echo '[]')
          PR_URL=$(echo "$PR_JSON" | jq -r '.[0].url // empty')
          IS_DRAFT=$(echo "$PR_JSON" | jq -r '.[0].isDraft // empty')
          if   [ -n "$PR_URL" ] && [ "$IS_DRAFT" = "true" ]; then STATUS="draft"
          elif [ -n "$PR_URL" ]; then STATUS="pr_opened"
          else STATUS="failed"; fi
          echo "Reporting status=$STATUS pr=$PR_URL"
          if [ -z "$CALLBACK_URL" ] || [ -z "$CALLBACK_TOKEN" ]; then
            echo "CALLBACK_URL or CALLBACK_TOKEN not set; skipping Slack status."; exit 0
          fi
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Authorization: Bearer ${CALLBACK_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg id "$ISSUE_ID" --arg s "$STATUS" --arg u "$PR_URL" \
                  --arg e "$EXC" --arg c "$CLS" --arg m "$MTH" \
                  '{issueId:$id, status:$s, prUrl:$u, exceptionType:$e, targetClass:$c, targetMethod:$m}')"
