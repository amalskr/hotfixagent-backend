name: HotFix Revise

# Reviewer drives changes on an open hotfix PR by mentioning the trigger phrase
# (default @claude) in a PR comment / review. Claude reads the thread + diff and
# pushes a revision to the SAME PR branch.
#
# To change the mention to e.g. @fixagent, set repo VARIABLE HOTFIX_TRIGGER_PHRASE
# to "@fixagent". It is used BOTH in the if-guard and the action's trigger_phrase.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  revise:
    # Only on PRs, only when a HUMAN mentions the trigger phrase. The bot guard
    # stops Claude from triggering itself (infinite loop).
    if: |
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         contains(github.event.comment.body, vars.HOTFIX_TRIGGER_PHRASE || '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
         contains(github.event.comment.body, vars.HOTFIX_TRIGGER_PHRASE || '@claude')) ||
        (github.event_name == 'pull_request_review' &&
         contains(github.event.review.body, vars.HOTFIX_TRIGGER_PHRASE || '@claude'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    # A reviewer switches provider for one revision by writing "llm=gemini" in
    # the comment; otherwise the HOTFIX_LLM repo variable decides.
    env:
      LLM: ${{ contains(format('{0}{1}', github.event.comment.body, github.event.review.body), 'llm=gemini') && 'gemini' || (vars.HOTFIX_LLM || 'claude') }}
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ vars.HOTFIX_JAVA_VERSION || '17' }}

      - name: Claude revises the PR
        if: env.LLM != 'gemini'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: ${{ vars.HOTFIX_TRIGGER_PHRASE || '@claude' }}
          claude_args: |
            --max-turns ${{ vars.HOTFIX_MAX_TURNS || '40' }}
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(./gradlew:*),Bash(git:*),Bash(gh:*)"
            --append-system-prompt "You are revising an existing hotfix PR based on reviewer feedback. Address the request precisely. Never silence a crash with an empty or swallowing try/catch — fix the root cause (validate input, null-safety, correct logic). Keep the change minimal. Build and run the unit tests before pushing. Push to the same PR branch; do not open a new PR."

      # claude-code-action checks out the PR branch itself; the Gemini CLI does not.
      - name: Check out the PR branch for Gemini
        if: env.LLM == 'gemini'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "hotfix-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo '.gemini/' >> .git/info/exclude
          gh pr checkout "$PR_NUMBER"

      - name: Gemini revises the PR
        if: env.LLM == 'gemini'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.HOTFIX_GEMINI_MODEL }}
          prompt: |
            You are revising an existing hotfix pull request in this Android repository
            based on reviewer feedback. PR number: #${{ github.event.issue.number || github.event.pull_request.number }}.
            Its branch is already checked out in the working directory.

            Read the PR context first:
              gh pr view ${{ github.event.issue.number || github.event.pull_request.number }} --json title,body,headRefName,baseRefName,comments
              gh pr diff ${{ github.event.issue.number || github.event.pull_request.number }}

            Address the reviewer's request precisely and keep the change minimal. Build
            with `${{ vars.HOTFIX_BUILD_CMD || './gradlew assembleDebug' }}` and run
            `${{ vars.HOTFIX_TEST_CMD || './gradlew testDebugUnitTest' }}`, iterating until
            both pass. Then commit and push to the SAME PR branch (git push) and reply
            with a short summary:
              gh pr comment ${{ github.event.issue.number || github.event.pull_request.number }} --body <summary>

            Never silence a crash with an empty or swallowing try/catch — fix the root
            cause (validate input, null-safety, bounds, correct logic). Never catch
            kotlinx.coroutines CancellationException. Do NOT open a new PR, never run
            'gh pr merge', and do not commit .gemini/ or build outputs. If you cannot
            make it pass, push nothing and explain the problem in a PR comment.
          settings: |
            {
              "model": { "maxSessionTurns": ${{ vars.HOTFIX_MAX_TURNS || '40' }} },
              "tools": {
                "core": [
                  "read_file", "read_many_files", "write_file", "replace",
                  "glob", "search_file_content", "list_directory", "run_shell_command"
                ]
              }
            }
